<!DOCTYPE html>
<html lang="en">
<head>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api-ecommerce</title>
    <link
      rel="shortcut icon"
      href="/frontend/icons/shopping_cart.svg"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/styles/main.css" />
    <link rel="stylesheet" href="/frontend/styles/nav.css" />
    <link rel="stylesheet" href="/frontend/styles/login.css" />
    <link rel="stylesheet" href="/frontend/styles/estrellasFondo.css" />
    <link rel="stylesheet" href="/frontend/styles/admin.css" />
    <link rel="stylesheet" href="/frontend/styles/modalcard.css" />
  </head>
</head>
<body>
  <div id="bg_class"></div>
  <header>
      <nav class="nav">
        <input type="checkbox" id="nav_checkbox" class="nav_checkbox" />
        <label for="nav_checkbox" class="nav_toggle">
          <img src="./icons/menu-2.svg" alt="" class="menu" />
          <img src="./icons/close.svg" alt="" class="close" />
        </label>

        <ul class="nav-ul">
          <li>
            <a href="../index.html">E-commerce-API</a>
          </li>
          <li>
          </li>
          <li id="li_user">
            <!-- contenido dinamico -->
            <!-- <a href="#" id="btn_user"></a> -->
          </li>
          
        </ul>
      </nav>
    </header>
    <main class="admin-main">

      <div class="admin-header">
        <h1>Panel de Administración</h1>
        <p>Bienvenido al panel de administración</p>
      </div>

      <div class="admin-section">
        <span>
          <h2>Gestión de Productos</h2>
          <p>Aquí puedes agregar, editar o eliminar productos.</p>
        </span>
        <span>
          <button id="btnAgregarProducto">Agregar Producto</button>
          <input type="text" id="buscador" placeholder="Buscar producto..." />
        </span>
      </div>

      <div id="contenedorProductos">
        <!-- Aquí irían los productos  -->
      </div>

      <!-- modal de los productos -->
      <div class="modal-overlay" id="modal">
        <div class="modal-card">
          <h2 id="modalTitle"></h2>
          <button class="close-modal" id="closeModal">&times;</button>
          <form class="modal-form" id="modalForm" >
            <div>
              <label for="modalName">Nombre</label>
              <input type="text" id="modalName" name="modalName" />
            </div>
            <div>
              <label for="quantity">Cantidad</label>
              <input type="number" id="quantity" name="quantity" />
            </div>
            <div>
              <label for="price">Precio</label>
              <input type="number" id="price" name="price" />
            </div>
            <div>
              <label for="modalDescription">Descripción</label>
              <textarea id="modalDescription" name="modalDescription"></textarea>
            </div>
            <div>
              <label for="modalCategory">Categoría</label>
              <select id="modalCategory" name="modalCategory">
                <option value="">Seleccionar</option>
                <option value="Procesadores">Procesadores</option>
                <option value="Tarjetas Gráficas">Tarjetas Gráficas</option>
                <option value="Memorias RAM">Memorias RAM</option>
                <option value="Almacenamiento">Almacenamiento</option>
                <option value="Placas Base">Placas Base</option>
              </select>
            </div>
            <div>
              <label for="modalImage">Imagen</label>
              <input type="file" id="modalImage" name="modalImage" />
            </div>
            
            <button id="btnFormData" type="submit">---</button>
          </form>
        </div>
      </div>


    </main>
    <footer>Hola como estas, David gomez</footer>
</body>
  <script src="../scripts/estrellas.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/admin.js"></script>
</html>
